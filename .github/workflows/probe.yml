name: audio3d-probe
on: push
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Set-Location bin
          foreach ($d in 'wasapi', 'directsound', 'winmm') {
            $env:SDL_AUDIODRIVER = $d
            "== $d"
            & .\probe.exe 2>&1
          }
